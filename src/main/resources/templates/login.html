<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Software Development Document Environment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800" th:text="${appName}">Software Development Document Environment</h1>
            <p class="text-slate-500 mt-2">Sign in to manage SDLC phase deliverables</p>
        </div>

        <div th:if="${param.error}" class="bg-red-50 text-red-700 p-3 rounded-lg border border-red-200 text-sm mb-4">
            <span th:if="${session.loginError != null}" th:text="${session.loginError}">Invalid credentials.</span>
            <span th:if="${session.loginError == null}">Invalid username or password.</span>
        </div>

        <div th:if="${param.logout}" class="bg-emerald-50 text-emerald-700 p-3 rounded-lg border border-emerald-200 text-sm mb-4">
            You have successfully logged out.
        </div>

        <div th:if="${successMessage}" class="bg-emerald-50 text-emerald-700 p-3 rounded-lg border border-emerald-200 text-sm mb-4" th:text="${successMessage}">
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="w-full pl-4 pr-10 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <!-- Closed Eye Icon (initial state) -->
                        <svg id="closedEyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                        <!-- Open Eye Icon (hidden by default) -->
                        <svg id="openEyeIcon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <a href="/forgot-password" class="text-blue-600 hover:underline">Forgot password?</a>
                <span class="text-slate-400">|</span>
                <span class="text-slate-600">Auth Mode: <strong class="text-slate-800" th:text="${authStrategy}">DB</strong></span>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-200">
                Log In
            </button>
        </form>

        <div class="mt-6 border-t border-slate-200 pt-4 text-center text-sm text-slate-600">
            Don't have an account? <a href="/register" class="text-blue-600 font-semibold hover:underline">Register here</a>
        </div>
    </div>

    <!-- Script to toggle password input visibility and swap eye icons -->
    <script>
        function togglePasswordVisibility() {
            var passwordField = document.getElementById("password");
            var closedEye = document.getElementById("closedEyeIcon");
            var openEye = document.getElementById("openEyeIcon");

            if (passwordField.type === "password") {
                passwordField.type = "text";
                closedEye.classList.add("hidden");
                openEye.classList.remove("hidden");
            } else {
                passwordField.type = "password";
                closedEye.classList.remove("hidden");
                openEye.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
