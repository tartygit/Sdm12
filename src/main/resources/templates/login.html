<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Software Development Document Environment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800" th:text="${appName}">Software Development Document Environment</h1>
            <p class="text-slate-500 mt-2">Sign in to manage SDLC phase deliverables</p>
        </div>

        <div th:if="${param.error}" class="bg-red-50 text-red-700 p-3 rounded-lg border border-red-200 text-sm mb-4">
            <span th:if="${session.loginError != null}" th:text="${session.loginError}">Invalid credentials.</span>
            <span th:if="${session.loginError == null}">Invalid username or password.</span>
        </div>

        <div th:if="${param.logout}" class="bg-emerald-50 text-emerald-700 p-3 rounded-lg border border-emerald-200 text-sm mb-4">
            You have successfully logged out.
        </div>

        <div th:if="${successMessage}" class="bg-emerald-50 text-emerald-700 p-3 rounded-lg border border-emerald-200 text-sm mb-4" th:text="${successMessage}">
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
            </div>

            <!-- Option to view password during login -->
            <div class="flex items-center">
                <input type="checkbox" id="showPassword" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded" onclick="togglePasswordVisibility()">
                <label for="showPassword" class="ml-2 text-sm font-medium text-slate-700 select-none cursor-pointer">Show Password</label>
            </div>

            <div class="flex items-center justify-between text-sm">
                <a href="/forgot-password" class="text-blue-600 hover:underline">Forgot password?</a>
                <span class="text-slate-400">|</span>
                <span class="text-slate-600">Auth Mode: <strong class="text-slate-800" th:text="${authStrategy}">DB</strong></span>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-200">
                Log In
            </button>
        </form>

        <div class="mt-6 border-t border-slate-200 pt-4 text-center text-sm text-slate-600">
            Don't have an account? <a href="/register" class="text-blue-600 font-semibold hover:underline">Register here</a>
        </div>
    </div>

    <!-- Script to toggle password input visibility -->
    <script>
        function togglePasswordVisibility() {
            var passwordField = document.getElementById("password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }
    </script>
</body>
</html>
