<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - SDM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Reset Password</h1>
            <p class="text-slate-500 mt-1">Request a reset link for your SDM account</p>
        </div>

        <div th:if="${error}" class="bg-red-50 text-red-700 p-3 rounded-lg border border-red-200 text-sm mb-4" th:text="${error}">
        </div>

        <div th:if="${resetToken}" class="bg-emerald-50 text-emerald-800 p-4 rounded-lg border border-emerald-200 text-sm mb-6">
            <p class="font-bold mb-1">Simulated Password Reset Email Sent!</p>
            <p class="mb-2">Click the link below to change your password:</p>
            <a th:href="@{/reset-password(token=${resetToken})}"
               class="text-blue-600 font-bold underline break-all hover:text-blue-800" th:text="'http://localhost:8080/reset-password?token=' + ${resetToken}">
            </a>
        </div>

        <form th:action="@{/forgot-password}" method="post" class="space-y-4" th:if="${resetToken == null}">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Registered Email Address</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-200">
                Generate Reset Link
            </button>
        </form>

        <div class="mt-6 border-t border-slate-200 pt-4 text-center text-sm text-slate-600">
            Remembered your password? <a href="/login" class="text-blue-600 font-semibold hover:underline">Log in here</a>
        </div>
    </div>
</body>
</html>
