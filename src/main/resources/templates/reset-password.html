<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - SDM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">New Password</h1>
            <p class="text-slate-500 mt-1">Please enter your new strong account password</p>
        </div>

        <div th:if="${error}" class="bg-red-50 text-red-700 p-3 rounded-lg border border-red-200 text-sm mb-4" th:text="${error}">
        </div>

        <form th:action="@{/reset-password}" method="post" class="space-y-4">
            <input type="hidden" name="token" th:value="${token}">

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">New Password</label>
                <input type="password" name="newPassword" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
                <p class="text-xs text-slate-400 mt-1">Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char.</p>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-200">
                Save New Password
            </button>
        </form>
    </div>
</body>
</html>
